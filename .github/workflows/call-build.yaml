name: caller-build-yaml

on: 
  push:
    branches:
      - main 


jobs:
  caller-build-workflow:
    uses: ./.github/workflows/reusable-build.yaml
    with:
      app_name: "my-web-app"
      environment: "production"
    secrets: 
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  get_build_version:
    needs: caller-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: printing the build version
        run: |
          echo "build version is: ${{ needs.caller-build-workflow.outputs.build_version }}"
