name: resusable build

on: 
  workflow_call:
    inputs:
      app_name: 
        type: string
        required: true
      environment:
        type: string
        required: true
        default: 'staging'
    secrets:
      DOCKERHUB_TOKEN:
       required: true

    outputs:
      build_version:
        description: provide the build version
        value: ${{ jobs.reusable_build.outputs.build_version }}

jobs:
  reusable_build:
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.generate_version.outputs.build_version }}

    steps:
    - name: checkout the code
      uses: actions/checkout@v4

    - name: Generate Version String
      id: generate_version
      run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0-$SHORT_SHA"
          echo "build_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

    - name: print build target
      run: echo "building ${{ inputs.app_name }} for ${{ inputs.environment }}"

    - name: verify docker token presence 
      run: |
        if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
           echo "docker token is set: true"
        else
           echo "docker token is set: false"
        fi

